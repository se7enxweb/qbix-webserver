<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>{{brand}} Control Panel</title>
{{brandHead}}
<style>{{@common/chrome.css}}{{@style.css}}</style></head><body>
<div class="top">
  <h1><a href="/Q/panel" style="color:inherit;text-decoration:none"><img src="/Q/icon-48.png" alt="" width="24" height="24" style="vertical-align:middle;margin-right:6px">{{brand}}</a></h1>
  <div class="qnav" role="navigation" aria-label="Server views"><a href="/Q/dashboard">Dashboard</a><a href="/Q/panel" aria-current="page">Control Panel</a><a href="/Q/docs">Documentation</a><a href="/Q/phpinfo">PHP Info</a><a href="/Q/health" title="Health, as JSON">Health</a><a href="/Q/metrics" title="Metrics, in Prometheus text format">Metrics</a></div>
  <div class="status"><span class="pulse"></span> Running</div>
</div>
<div class="content refused" style="max-width:560px;margin:40px auto">
  <div class="card">
    <h3>The control panel is not available here</h3>
    <p style="font-size:13px;color:var(--dim);line-height:1.6">{{message}}</p>
  </div>
</div>
<style>
/* Inline code never breaks inside itself: "Q.panel.remote" and
   "--root=<document root>" came apart mid-word at narrow widths. Long
   commands are written as several <code> pieces, so lines break between them. */
.refused code{white-space:nowrap;font-size:12px}
.refused .card{overflow-wrap:break-word}
</style>
</body></html>
