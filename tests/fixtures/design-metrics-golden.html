<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Qbix Server Metrics</title>
<link rel="icon" href="/Q/favicon.svg"><style>/* The chrome every server view shares -- palette, header, brand, status
   badge and view navigation -- included ahead of the view's own style.css,
   which changes only what differs. */
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0b14;--sfc:rgba(22,24,40,.7);--sfc2:#161828;--sfc-solid:#161828;--bdr:rgba(255,255,255,.06);--txt:#e1e4ed;--dim:#80859e;
--ac:#7c5cfc;--ac2:#a78bfa;--grn:#4ade80;--yel:#fbbf24;--red:#f87171;--cyn:#22d3ee;--pur:#a78bfa;--glow:rgba(124,92,252,.08);--row:rgba(255,255,255,.03)}
/* --dim is the quiet text colour: 4.5:1 or better on the page and the cards, in both schemes. */
@media(prefers-color-scheme:light){:root{--bg:#f4f5f7;--sfc:rgba(255,255,255,.85);--sfc2:#fff;--sfc-solid:#fff;--bdr:rgba(0,0,0,.08);--txt:#1a1a2e;--dim:#5d6178;--glow:rgba(124,92,252,.05);--row:rgba(0,0,0,.025)}}
body{font-family:-apple-system,system-ui,'Segoe UI',sans-serif;
background:var(--bg);color:var(--txt);font-size:13px;min-height:100vh;
background-image:radial-gradient(ellipse 80% 60% at 20% 0%,rgba(124,92,252,.12) 0%,transparent 60%),
radial-gradient(ellipse 60% 50% at 80% 100%,rgba(34,211,238,.06) 0%,transparent 50%);background-attachment:fixed}
/* Header and section tabs stick together, whatever height the header wraps to. */
.chrome{position:sticky;top:0;z-index:50}
.top{padding:16px 20px;display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;
background:rgba(10,11,20,.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
border-bottom:1px solid var(--bdr)}
.top h1{font-size:17px;color:#fff;font-weight:700;letter-spacing:-.3px}
.top h1 img{vertical-align:middle}
.status{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:500;
padding:4px 12px;border-radius:20px;background:rgba(34,197,94,.1);color:var(--grn)}
.status .pulse{width:6px;height:6px;border-radius:50%;background:var(--grn);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.qnav{display:flex;flex-wrap:wrap;gap:4px;font-size:12px;min-width:0}
.qnav a{color:var(--dim);text-decoration:none;padding:2px 9px;border:1px solid rgba(255,255,255,.08);border-radius:10px;white-space:nowrap}
.qnav a:hover,.qnav a:focus-visible{color:#fff;border-color:var(--ac2)}
.qnav a[aria-current=page]{color:var(--ac2);background:var(--glow)}
.content{padding:20px;max-width:1200px;margin:0 auto}
@media(max-width:768px){.top{padding:14px 16px}.top h1{font-size:15px}.top .qnav{order:3;flex:1 0 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.content{padding:16px}}
@supports(padding:env(safe-area-inset-top)){.top{padding-top:calc(16px + env(safe-area-inset-top))}}
/* The metrics view's own rules; the shared chrome is common/chrome.css. */
html{scroll-padding-top:110px;scroll-behavior:smooth}
.card{background:var(--sfc);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bdr);border-radius:12px;padding:14px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.card .l{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.card .v{font-size:22px;font-weight:700;line-height:1.2}
.card .s{font-size:12px;color:var(--dim);margin-top:4px}
.mwrap{max-width:1200px;margin:0 auto;padding:18px 16px 40px}
.mbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.mbar input{flex:1 1 220px;min-width:0;padding:8px 12px;border-radius:10px;border:1px solid var(--bdr);background:var(--sfc2);color:var(--txt);font-size:14px}
.mbar a{font-size:13px;color:var(--dim)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
@media(max-width:700px){.mgrid{grid-template-columns:1fr}}
.mfam h2{font-size:14px;margin:0 0 4px;word-break:break-all}
.mfam .mtype{font-size:12px;color:var(--dim);margin-left:6px;font-weight:400}
.mfam p{font-size:12px;color:var(--dim);margin:0 0 8px}
.mfam table{width:100%;border-collapse:collapse;font-size:12px}
.mfam td{padding:4px 0;border-top:1px solid var(--bdr);vertical-align:top}
.mfam td.v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
.mfam td.l{word-break:break-all;color:var(--dim)}
.mempty{color:var(--dim);font-size:14px}
</style></head><body>
<div class="chrome">
<div class="top">
  <h1><a href="/Q/metrics" style="color:inherit;text-decoration:none"><img src="/Q/icon-48.png" alt="" width="24" height="24" style="vertical-align:middle;margin-right:6px">Qbix Server</a></h1>
  <div class="qnav" role="navigation" aria-label="Server views"><a href="/Q/dashboard">Dashboard</a><a href="/Q/panel">Control Panel</a><a href="/Q/docs">Documentation</a><a href="/Q/phpinfo">PHP Info</a><a href="/Q/health" title="Health, as JSON">Health</a><a href="/Q/metrics" aria-current="page" title="Metrics, in Prometheus text format">Metrics</a></div>
  <div class="status"><span class="pulse"></span> Running</div>
</div>
</div>
<main class="mwrap">
  <div class="mbar"><input id="mfilter" type="search" placeholder="Filter metrics by name, help or label" aria-label="Filter metrics"><a href="/Q/metrics?format=text">Open raw</a><span id="mcount" class="mempty"></span></div>
  <div id="mgrid" class="mgrid"></div>
</main>
<script>var METRICS_TEXT = "# HELP qbix_requests_total Requests served\n# TYPE qbix_requests_total counter\nqbix_requests_total 42\n";</script>
<script>(function () {
  // Prometheus text exposition, grouped by family: # HELP, # TYPE, samples.
  var fams = {}, order = [];
  function fam(n) { if (!fams[n]) { fams[n] = { name: n, help: '', type: '', rows: [] }; order.push(n); } return fams[n]; }
  function base(n) { return n.replace(/_(bucket|sum|count|total|created)$/, ''); }
  (METRICS_TEXT || '').split('\n').forEach(function (line) {
    var m;
    if ((m = line.match(/^# HELP (\S+) (.*)$/))) { fam(m[1]).help = m[2]; return; }
    if ((m = line.match(/^# TYPE (\S+) (\S+)/))) { fam(m[1]).type = m[2]; return; }
    if (!line || line.charAt(0) === '#') return;
    if ((m = line.match(/^([a-zA-Z_:][a-zA-Z0-9_:]*)(\{[^}]*\})?\s+(\S+)/))) {
      var n = fams[m[1]] ? m[1] : (fams[base(m[1])] ? base(m[1]) : m[1]);
      fam(n).rows.push({ metric: m[1], labels: m[2] ? m[2].slice(1, -1) : '', value: m[3] });
    }
  });
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function bytes(x) {
    var u = ['B', 'KB', 'MB', 'GB', 'TB'], i = 0;
    while (Math.abs(x) >= 1024 && i < u.length - 1) { x /= 1024; i++; }
    return (i ? x.toFixed(1) : x) + ' ' + u[i];
  }
  function num(v, name) {
    var x = Number(v);
    if (isFinite(x) && /_bytes$/.test(name || '')) return bytes(x);
    if (!isFinite(x)) return v;
    if (Math.abs(x) >= 1e6 || (Math.abs(x) < 1e-3 && x !== 0)) return x.toPrecision(4);
    return Math.round(x * 1000) / 1000 === x ? x.toLocaleString() : x.toLocaleString(undefined, { maximumFractionDigits: 3 });
  }
  var grid = document.getElementById('mgrid'), box = document.getElementById('mfilter'), count = document.getElementById('mcount');
  function draw() {
    var q = (box.value || '').toLowerCase(), html = '', shown = 0;
    order.forEach(function (n) {
      var f = fams[n];
      var hay = (f.name + ' ' + f.help + ' ' + f.rows.map(function (r) { return r.metric + ' ' + r.labels; }).join(' ')).toLowerCase();
      if (q && hay.indexOf(q) === -1) return;
      shown++;
      html += '<section class="card mfam"><h2>' + esc(f.name) + (f.type ? '<span class="mtype">' + esc(f.type) + '</span>' : '') + '</h2>'
        + (f.help ? '<p>' + esc(f.help) + '</p>' : '') + '<table>'
        + f.rows.map(function (r) {
            var label = (r.metric !== f.name ? r.metric.slice(f.name.length).replace(/^_/, '') + ' ' : '') + r.labels;
            return '<tr><td class="l">' + esc(label || '—') + '</td><td class="v">' + esc(num(r.value, r.metric)) + '</td></tr>';
          }).join('') + '</table></section>';
    });
    grid.innerHTML = html || '<p class="mempty">No metrics match.</p>';
    count.textContent = shown + ' of ' + order.length + ' families';
  }
  box.addEventListener('input', draw);
  draw();
})();
</script>
</body></html>
