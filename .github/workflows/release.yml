name: Build Static Binaries

# Every tag builds the whole matrix: each platform x PHP 8.2-8.5 x variant
# (mini, lite, standard, full), plus the source kit. Which extensions a build
# carries is not written here: packaging/ci/release-matrix.php asks the
# baseline (build/extensions.json, through the engine's own resolver -- what
# `qbixctl ext:list` shows) for each job.
# See docs/binaries.md for the variants and docs/requirements.md for the
# baseline itself.
#
# A manual run can narrow the matrix -- worth doing while iterating on a
# build, since the whole thing is about seventy jobs.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms, comma-separated (empty = all: linux-x86_64,linux-aarch64,macos-arm64,windows-x64)'
        default: ''
      php:
        description: 'PHP versions, comma-separated (empty = all: 8.2,8.3,8.4,8.5)'
        default: ''
      variants:
        description: 'Variants, comma-separated (empty = all: mini,lite,standard,full)'
        default: ''
      cache:
        description: 'Reuse cached source downloads (false forces fresh downloads)'
        default: 'true'

permissions:
  contents: write

jobs:
  # bin/qbixserver.phar is committed and is what a Composer install runs, but
  # nothing rebuilds it -- three releases in a row shipped a phar older than
  # the source beside it. The phar workflow keeps it current on the branch;
  # this refuses to cut a release if a tag was made before that landed.
  phar-is-current:
    name: phar matches its sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: phar.readonly=0
          coverage: none

      - name: Check
        run: php tests/phar-is-current.php

  plan:
    name: plan the matrix from the baseline
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      distros: ${{ steps.plan.outputs.distros }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Plan
        id: plan
        run: |
          php packaging/ci/release-matrix.php \
            '${{ github.event.inputs.platforms }}' \
            '${{ github.event.inputs.php }}' \
            '${{ github.event.inputs.variants }}' >> "$GITHUB_OUTPUT"
          grep '^matrix=' "$GITHUB_OUTPUT" | cut -c1-2000
          # The package distributions, and the version packages carry: the
          # tag's, or for any other run the last tag plus ~dev and the commit
          # (a version deb and rpm both sort before the next release).
          echo "distros=$(php packaging/nfpm/render.php --list | awk '{print $1}' | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else
            git fetch -q --tags origin || true
            last=$(git tag -l 'v0.0.*' --sort=version:refname | tail -1); last="${last#v}"
            v="${last:-0.0.0}~dev$(git rev-list --count HEAD).g$(git rev-parse --short HEAD)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          grep -E '^(distros|version)=' "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }} php${{ matrix.php }} ${{ matrix.variant }}
    # A leg marked experimental may fail without holding the others back:
    # Windows (docs/binaries.md says why and what would change it) and the
    # full variant, which is best effort everywhere.
    continue-on-error: ${{ matrix.experimental }}
    env:
      ART: qbixserver-${{ matrix.name }}
      PHPART: php-${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      # The version the binary shows (--version, the dashboard). The phar is
      # rebuilt here and stamps the nearest release tag -- but a checkout has
      # no tags, so it fell back to the upstream engine's number, and spc's
      # build directories made the tree look modified: v1.5.0+<commit>-dirty.
      # The tag on a release build; the latest release tag on any other run.
      - name: Name the version this build ships
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME}"; else
            v=$(git ls-remote --tags --refs origin 'v0.0.*' | sed 's#.*refs/tags/##' | sort -V | tail -1)
          fi
          echo "QBIX_SHIP_VERSION=$v" >> "$GITHUB_ENV"
          printf '%s\n' buildroot/ downloads/ source/ spc spc-src/ log/ pkgroot/ win_exts.txt '*.obj' 'qbix_fork.*' \
            'qbixserver-*' 'php-*' >> .git/info/exclude
          echo "ships as $v"

      # ── Cache ────────────────────────────────────────────
      # The downloaded sources, per platform and PHP version: fetching them is
      # most of what goes wrong (a flaky mirror) and a good part of the time.
      # Built libraries are not cached. spc skips a library whose files are in
      # buildroot, then copies its licence out of source/, which a buildroot
      # cache does not carry -- "Cannot find any license file in source
      # [openssl]" on the second run -- and caching source/ too is gigabytes.
      - name: Cache downloaded sources
        if: github.event.inputs.cache != 'false'
        uses: actions/cache@v4
        with:
          path: downloads
          key: spc-dl-v1-${{ matrix.platform }}-php${{ matrix.php }}-${{ matrix.libs_key }}
          restore-keys: |
            spc-dl-v1-${{ matrix.platform }}-php${{ matrix.php }}-

      # ── Unix build dependencies ──────────────────────────
      - name: Install system build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake autoconf automake libtool \
            pkg-config pkgconf bison re2c curl wget \
            musl-tools musl-dev

      - name: Install system build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake autoconf automake libtool pkg-config bison re2c

      # ── Download spc binary ──────────────────────────────
      - name: Download spc (Unix)
        if: runner.os != 'Windows'
        run: |
          SPC_URL="https://dl.static-php.dev/static-php-cli/spc-bin/nightly/spc-${{ matrix.spc_os }}-${{ matrix.spc_arch }}"
          echo "Downloading: $SPC_URL"
          for i in 1 2 3; do
            curl -fSL --retry 3 --retry-delay 5 "$SPC_URL" -o spc && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          if [ ! -f spc ]; then
            echo "Self-hosted download failed, trying GitHub release..."
            curl -fSL "https://github.com/crazywhalecc/static-php-cli/releases/latest/download/spc-${{ matrix.spc_os }}-${{ matrix.spc_arch }}" -o spc
          fi
          chmod +x spc
          ./spc --version

      - name: Setup spc from source (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The nightly spc binary has Windows extraction bugs, so this runs
          # spc from source with the runner's PHP instead.
          #
          # Pinned to a release rather than tracking the default branch. It was
          # unpinned, which meant the Windows build inherited whatever was in
          # upstream's tip on the day -- and upstream's last release is four
          # months behind that tip, so the one platform built from source was
          # also the only one built from code nobody had cut a version of. The
          # symptom was PHP's own configure appearing to succeed and `nmake
          # clean` then failing in two seconds, while every other package built
          # normally.
          #
          # Raising this is a deliberate step: check the platform still builds
          # before moving it.
          # One line on purpose. This step runs under PowerShell, where the
          # line continuation is a backtick and a backslash is just an
          # argument -- so a wrapped command here clones "\" and then tries to
          # run the URL as a program.
          git clone --depth 1 --branch 2.8.5 https://github.com/crazywhalecc/static-php-cli.git spc-src
          cd spc-src
          php -v
          composer install --no-dev --no-interaction --quiet 2>&1
          php bin/spc --version

      # ── Unix-only setup steps ────────────────────────────
      - name: Make pkg-config findable everywhere
        if: runner.os != 'Windows'
        run: |
          PKG_REAL=""
          for p in /usr/bin/pkg-config /opt/homebrew/bin/pkg-config /usr/local/bin/pkg-config; do
            if [ -x "$p" ]; then PKG_REAL="$p"; break; fi
          done
          if [ -z "$PKG_REAL" ] && command -v pkgconf &>/dev/null; then
            PKG_REAL="$(which pkgconf)"
          fi
          if [ -n "$PKG_REAL" ]; then
            echo "Found pkg-config at: $PKG_REAL"
            for dest in /usr/local/bin /usr/local/musl/bin /usr/bin; do
              sudo mkdir -p "$dest" 2>/dev/null || true
              sudo cp -f "$PKG_REAL" "$dest/pkg-config" 2>/dev/null || true
            done
          fi

      - name: Setup musl cross-compiler wrappers (Linux only)
        if: runner.os == 'Linux'
        run: |
          ARCH=$(uname -m)
          MUSL_PREFIX="${ARCH}-linux-musl"
          if ! command -v ${MUSL_PREFIX}-gcc &>/dev/null; then
            echo "Creating ${MUSL_PREFIX} toolchain wrappers..."
            sudo mkdir -p /usr/local/musl/bin /usr/local/musl/${MUSL_PREFIX}/bin
            for tool in gcc g++; do
              SRC=$(which musl-$tool 2>/dev/null || which musl-gcc 2>/dev/null)
              if [ -n "$SRC" ]; then
                sudo cp -f "$SRC" "/usr/local/musl/bin/${MUSL_PREFIX}-${tool}"
                sudo cp -f "$SRC" "/usr/local/musl/${MUSL_PREFIX}/bin/${MUSL_PREFIX}-${tool}"
              fi
            done
            for tool in ar ld nm objcopy objdump ranlib readelf strip; do
              SRC=$(which $tool 2>/dev/null)
              if [ -n "$SRC" ]; then
                sudo cp -f "$SRC" "/usr/local/musl/bin/${MUSL_PREFIX}-${tool}"
                sudo cp -f "$SRC" "/usr/local/musl/${MUSL_PREFIX}/bin/${MUSL_PREFIX}-${tool}"
              fi
            done
          fi

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # spc locates Visual Studio by testing six hardcoded paths, and reports
      # nothing useful when none of them exist: findVisualStudio() returns
      # false, the caller reads ['version'] off it, and the message that
      # reaches the log is "Current VS version  is not supported yet!" with an
      # empty version. That happens twenty minutes into the job, after every
      # source has been downloaded, and it says nothing about Visual Studio's
      # location -- which is the only thing wrong.
      #
      # So the same question is asked here, in two seconds, and answered in
      # full. This is a guard against the runner image moving again, not
      # against anything in this repository.
      - name: Check Visual Studio is where spc looks for it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = @(
            'C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Professional\MSBuild\Current\Bin\MSBuild.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe',
            'C:\Program Files (x86)\Microsoft Visual Studio\2019\Community\MSBuild\Current\Bin\MSBuild.exe',
            'C:\Program Files (x86)\Microsoft Visual Studio\2019\Professional\MSBuild\Current\Bin\MSBuild.exe',
            'C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\MSBuild\Current\Bin\MSBuild.exe'
          )
          $found = $paths | Where-Object { Test-Path $_ }
          if ($found) {
            Write-Host "spc will find Visual Studio at:"
            $found | ForEach-Object { Write-Host "  $_" }
            exit 0
          }
          Write-Host "::error::spc cannot find Visual Studio, and will fail later with an empty version."
          Write-Host ""
          Write-Host "It only looks in these six places:"
          $paths | ForEach-Object { Write-Host "  $_" }
          Write-Host ""
          Write-Host "What is actually installed on this runner:"
          Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.FullName)" }
          Get-ChildItem 'C:\Program Files (x86)\Microsoft Visual Studio' -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.FullName)" }
          Write-Host ""
          Write-Host "Runner image: $env:ImageOS $env:ImageVersion"
          Write-Host "Pin 'runs-on' to an image carrying VS 2022, or teach spc the new path."
          exit 1

      - name: Run spc doctor (Unix, best-effort)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./spc doctor --auto-fix 2>&1 || echo "Doctor had issues (continuing)"

      - name: Run spc doctor (Windows, best-effort)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          php spc-src\bin\spc doctor --auto-fix 2>&1

      # ── Download sources ─────────────────────────────────
      # One unlucky fetch should not cost a platform. v0.0.4.26 lost its
      # release to a single failure downloading the musl toolchain.
      - name: Download PHP and extension sources (Unix)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          libs='${{ matrix.libs }}'
          for try in 1 2 3; do
            ./spc download --for-extensions='${{ matrix.extensions }}' \
              ${libs:+--for-libs="$libs"} --with-php='${{ matrix.php }}' && exit 0
            echo "download failed, retry $try of 3 in 15s"; sleep 15
          done
          echo "::error::spc download failed after 3 tries"; exit 1

      - name: Download PHP and extension sources (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $phpVer = '${{ matrix.php }}'
          $libs = '${{ matrix.libs }}'
          $libArg = @(); if ($libs) { $libArg = @("--for-libs=$libs") }
          # Try with FFI first (needed for the copy-on-write fork shim), fall
          # back without it, in which case the server uses php-cgi per request.
          $exts = '${{ matrix.extensions }},ffi'
          php spc-src\bin\spc download --for-extensions="$exts" @libArg --with-php=$phpVer 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "FFI download failed, building without it (will use php-cgi mode)"
            $exts = '${{ matrix.extensions }}'
            php spc-src\bin\spc download --for-extensions="$exts" @libArg --with-php=$phpVer
          }
          # One failed fetch should not cost the whole platform. v0.0.4.23 lost
          # its Windows binary to a single curl exit 22 on the icu archive,
          # which is reachable and was simply unlucky; the step below then
          # found no php.exe and skipped, and the job reported success.
          for ($try = 1; $try -le 3 -and $LASTEXITCODE -ne 0; $try++) {
            Write-Host "download failed, retry $try of 3 in 15s"
            Start-Sleep -Seconds 15
            php spc-src\bin\spc download --for-extensions="$exts" @libArg --with-php=$phpVer
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::spc download failed after 3 retries"
            exit 1
          }
          # Store which extensions we got
          Set-Content -Path "win_exts.txt" -Value $exts

      # ── Build ────────────────────────────────────────────
      # gd's libraries are named by the baseline (spc-libs): the download step
      # pulls an extension's suggested sources, but the build links none of
      # them unless asked, so gd came out able to read PNG only and
      # imagejpeg() was an undefined function at runtime.
      - name: Build static PHP CLI + phpmicro (Unix)
        if: runner.os != 'Windows'
        env:
          SPC_SKIP_DOCTOR_CHECK_ITEMS: "pkg-config,musl-wrapper"
        run: |
          libs='${{ matrix.libs }}'
          ./spc build '${{ matrix.extensions }}' --build-cli --build-micro ${libs:+--with-libs="$libs"}

      # spc extracts php-src with php-sdk-binary-tools\bin\7za.exe and that
      # file is not always there. When it is missing the extraction fails with
      # "The system cannot find the path specified", php_version.h is never
      # written, and spc dies several steps later inside preg_match() on the
      # false it got back from reading it -- a stack trace that says nothing
      # about the archiver. Its own doctor reports "7za.exe not found" much
      # earlier, in a step allowed to continue on error, so the warning was
      # there all along and nothing acted on it.
      #
      # The runner ships 7-Zip. Putting a copy where spc looks costs nothing
      # and removes the whole failure mode.
      - name: Make sure spc has an archiver (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdkBin = "php-sdk-binary-tools\bin"
          if (-not (Test-Path $sdkBin)) { New-Item -ItemType Directory -Force -Path $sdkBin | Out-Null }
          $target = Join-Path $sdkBin "7za.exe"
          if (Test-Path $target) {
            Write-Host "7za.exe already present"
          } else {
            $candidates = @(
              "C:\Program Files\7-Zip\7z.exe",
              "C:\Program Files (x86)\7-Zip\7z.exe",
              "C:\ProgramData\chocolatey\bin\7z.exe"
            )
            $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($found) {
              Copy-Item $found $target
              Write-Host "copied $found to $target"
            } else {
              choco install 7zip.commandline -y --no-progress 2>&1 | Out-Null
              $z = Get-Command 7za.exe -ErrorAction SilentlyContinue
              if (-not $z) { $z = Get-Command 7z.exe -ErrorAction SilentlyContinue }
              if ($z) { Copy-Item $z.Source $target; Write-Host "installed and copied $($z.Source)" }
              else { Write-Host "::error::no archiver available for spc"; exit 1 }
            }
          }
          Get-Item $target | Select-Object Name, Length

      - name: Build static PHP CLI + phpmicro (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exts = Get-Content "win_exts.txt" -ErrorAction SilentlyContinue
          if (-not $exts) { $exts = '${{ matrix.extensions }}' }
          $libs = '${{ matrix.libs }}'
          $libArg = @(); if ($libs) { $libArg = @("--with-libs=$libs") }
          Write-Host "Building with extensions: $exts"
          php spc-src\bin\spc build "$exts" --build-cli --build-micro @libArg

      # spc writes the compiler's own output only to its log files, so a
      # failed build said "exited with code 2" and nothing else, release after
      # release. Print the errors and the end of each log where it failed.
      - name: Show why the PHP build failed (Windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($f in 'log\spc.output.log', 'log\spc.shell.log', 'spc-src\log\spc.output.log', 'spc-src\log\spc.shell.log') {
            if (-not (Test-Path $f)) { continue }
            Write-Host "::group::$f -- lines with errors"
            Select-String -Path $f -Pattern 'error|fatal|unresolved|cannot open' | Select-Object -Last 80 | ForEach-Object { $_.Line }
            Write-Host "::endgroup::"
            Write-Host "::group::$f -- last 150 lines"
            Get-Content $f -Tail 150
            Write-Host "::endgroup::"
          }

      - name: Show why the PHP build failed (Unix)
        if: failure() && runner.os != 'Windows'
        shell: bash
        run: |
          for f in log/spc.output.log log/spc.shell.log; do
            [ -f "$f" ] || continue
            echo "::group::$f -- lines with errors"
            grep -n -E 'error:|Error [0-9]|undefined reference|fatal error|No rule to make' "$f" | tail -80
            echo "::endgroup::"
            echo "::group::$f -- last 150 lines"
            tail -150 "$f"
            echo "::endgroup::"
          done

      - name: Build qbix_fork.dll (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          # cl.exe is on PATH from ilammy/msvc-dev-cmd
          Write-Host "Compiling qbix_fork.dll..."
          cl /LD /O2 src\fork_shim.c /Fe:qbix_fork.dll
          if (Test-Path qbix_fork.dll) {
            Write-Host "Built qbix_fork.dll: $((Get-Item qbix_fork.dll).Length) bytes"
          } else {
            Write-Host "qbix_fork.dll build failed (Windows COW fork unavailable, php-cgi fallback)"
          }

      # ── The baseline, checked on what was built ──────────
      # The built interpreter itself is asked whether it loads every
      # extension the baseline lists for this variant and platform. A build
      # that silently dropped one (spc skips an extension whose library fails
      # to configure on some platforms) fails here, by name.
      - name: Check the build carries its baseline
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then php=buildroot/bin/php.exe; else php=buildroot/bin/php; fi
          # QBIX_STATIC_BUILD: this is a static build, so the platform's build
          # exclusions apply -- the check uses this machine as the platform.
          QBIX_STATIC_BUILD=1 PHP="$php" sh packaging/bin/qbix-ext check --variant='${{ matrix.variant }}'

      # ── Package ──────────────────────────────────────────
      - name: Build phar and combine (Unix)
        if: runner.os != 'Windows'
        run: |
          ./buildroot/bin/php -d phar.readonly=0 build-phar.php
          ./spc micro:combine bin/qbixserver.phar -O "$ART"
          chmod +x "$ART"
          ls -lh "$ART"
          cp buildroot/bin/php "$PHPART"
          chmod +x "$PHPART"

      # spc runs from the checkout's root on Windows too, so its output is
      # buildroot\bin\php.exe there -- not under spc-src\. This step looked in
      # spc-src\buildroot, found nothing, skipped itself as "PHP build did not
      # produce a binary", and the output check failed a build that had
      # succeeded.
      - name: Build phar and combine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "buildroot\bin\php.exe")) {
            Write-Host "::error::the PHP build produced no buildroot\bin\php.exe"
            exit 1
          }
          .\buildroot\bin\php.exe -d phar.readonly=0 build-phar.php
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          php spc-src\bin\spc micro:combine bin\qbixserver.phar -O "$env:ART.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "$env:ART.exe" | Select-Object Name, Length
          Copy-Item buildroot\bin\php.exe "$env:PHPART.exe"

      - name: Build GUI variant (Windows, no console)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:ART.exe")) { exit 0 }
          Copy-Item "$env:ART.exe" "$env:ART-gui.exe"
          editbin /SUBSYSTEM:WINDOWS "$env:ART-gui.exe"
          Write-Host "Built GUI variant (no console window on launch)"

      # ── Compress ─────────────────────────────────────────
      # NOTE: Do NOT UPX-pack the combined binary. `spc micro:combine`
      # appends the phar as an ELF overlay which phpmicro locates by
      # reading its own file at runtime; UPX rewrites the ELF and drops
      # that overlay, so the binary starts and tries to parse its own
      # compressed image as PHP (syntax error, unexpected token "!").

      # ── Smoke test ───────────────────────────────────────
      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          out=$(./"$ART" --help 2>&1)
          echo "$out" | head -5
          case "$out" in
            *"Parse error"*|*"Fatal error"*) echo "::error::binary is corrupt"; exit 1 ;;
          esac

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = & ".\$env:ART.exe" --help 2>&1 | Out-String
          $out.Split("`n") | Select-Object -First 5
          if ($out -match 'Parse error|Fatal error') { Write-Host "::error::binary is corrupt"; exit 1 }

      # Runs against the built binary on purpose: the notices this catches
      # only appear when the server runs from the phar, so the same check
      # in the test workflow, which runs from source, would pass blind.
      - name: Response bodies carry no diagnostics (Unix)
        if: runner.os != 'Windows'
        run: QB=./"$ART" bash tests/clean-body.sh

      # ── Upload ───────────────────────────────────────────
      # The steps above can each be made to fail properly, and still the thing
      # that matters is whether a binary exists. v0.0.4.23 shipped a lone DLL
      # because the build quietly produced nothing and every check was about a
      # step rather than an output. This one is about the output.
      - name: Check the build actually produced a server
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then want="$ART.exe"; else want="$ART"; fi
          if [ ! -s "$want" ]; then
            echo "::error::no server binary at $want - the build produced nothing"
            echo "what is here:"
            ls -la | sed 's/^/  /'
            exit 1
          fi
          echo "  $want  $(wc -c < "$want") bytes"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART }}
          if-no-files-found: error
          path: |
            ${{ env.ART }}*
            ${{ env.PHPART }}*
            qbix_fork.dll

  # The source kit: everything needed to build any variant locally -- the
  # phar, the console tools, the baseline and the recipes the matrix used --
  # for a platform or a PHP version no release job covers.
  source-kit:
    name: source kit
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Build the kit
        run: bash packaging/ci/source-kit.sh "${GITHUB_REF_NAME}"

      - name: Upload the kit
        uses: actions/upload-artifact@v4
        with:
          name: qbixserver-source-kit
          if-no-files-found: error
          path: qbixserver-source-kit-*.tar.gz

  # deb and rpm, one per distribution, each installed in a clean container of
  # that distribution and checked: dependencies resolve, the lite variant's
  # extensions are all there, and the server serves a page as its user.
  packages:
    name: package ${{ matrix.distro }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.plan.outputs.distros) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Build
        run: bash packaging/ci/build-packages.sh '${{ needs.plan.outputs.version }}' '${{ matrix.distro }}'

      - name: Install and check in ${{ matrix.distro }}
        run: bash packaging/ci/test-package.sh '${{ matrix.distro }}' dist/qbix-webserver*

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.distro }}
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.rpm

  release:
    needs: [build, source-kit, packages, phar-is-current]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      # Where a release note comes from, and why a tag alone no longer makes a
      # release.
      #
      # This has now been wrong in three different ways. Every release once
      # carried RELEASE_NOTES.md, a file describing v1.5.0, so each one
      # announced the same changes regardless of what was in it. Moving to the
      # tag's annotation fixed that, and left a subtler problem: a tag is cheap
      # and gets made whenever a build is worth having, so eight releases went
      # out in a single day, three of them with no title at all, and the
      # history read as noise.
      #
      # The notes now come from CHANGELOG.md, and the presence of a section is
      # what decides whether a release is published. Tag as often as is useful;
      # a tag with no section builds, tests, and stops. Writing the section is
      # the act of deciding to release, which is why the version and its notes
      # can no longer describe different things.
      - name: Take the release notes from CHANGELOG.md
        run: |
          tag='${{ github.ref_name }}'
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md is missing."
            echo "PUBLISH=no" >> "$GITHUB_ENV"
            exit 0
          fi
          # The section for this tag: its heading, up to the next one.
          awk -v tag="$tag" '
            $0 ~ "^## " tag "([ \t]|$)" { found = 1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > section.md
          if [ ! -s section.md ]; then
            echo "::notice::No CHANGELOG.md section for $tag, so no release is published."
            echo "Add a '## $tag' section and re-tag to publish one."
            echo "PUBLISH=no" >> "$GITHUB_ENV"
            exit 0
          fi
          # The heading is 'vX.Y.Z.N — summary', which is the release title
          # already written the way a reader wants it.
          head -1 section.md | sed 's/^##[[:space:]]*//' > tag-title.txt
          # The body is the rest, with the leading blank lines and the bare
          # date line dropped -- GitHub shows the date itself.
          tail -n +2 section.md \
            | sed '/^[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}[[:space:]]*$/d' \
            | awk 'NF {f = 1} f' > tag-body.md
          # Then the two links that make this findable: the whole changelog,
          # and what actually changed since the release before this one.
          prev=$(git tag -l 'v*' --sort=version:refname \
            | grep -B1 -x "$tag" | head -1)
          {
            printf '\n---\n\n'
            printf '[Full changelog](https://github.com/%s/blob/%s/CHANGELOG.md)' \
              '${{ github.repository }}' "$tag"
            if [ -n "$prev" ] && [ "$prev" != "$tag" ]; then
              printf ' · [All commits since %s](https://github.com/%s/compare/%s...%s)' \
                "$prev" '${{ github.repository }}' "$prev" "$tag"
            fi
            printf '\n'
          } >> tag-body.md
          echo "RELEASE_TITLE=$(cat tag-title.txt)" >> "$GITHUB_ENV"
          echo "PUBLISH=yes" >> "$GITHUB_ENV"
          echo "--- title ---"; cat tag-title.txt
          echo "--- body ---";  cat tag-body.md

      # Every build's files, flat, plus the names earlier releases used --
      # qbixserver-linux-x86_64 and so on, which README links to under
      # releases/latest/download/ -- as copies of the standard variant on
      # PHP 8.3, and a SHA256SUMS over the lot.
      - name: Assemble the release files
        if: env.PUBLISH == 'yes'
        run: bash packaging/ci/assemble-release.sh artifacts dist

      - name: Create Release
        if: env.PUBLISH == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TITLE }}
          body_path: tag-body.md
          draft: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: dist/*
