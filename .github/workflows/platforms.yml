name: Platforms

# Where Exponential Velocity runs, demonstrated rather than claimed.
#
# The static binaries cover five targets, because that is what the build
# toolchain ships for: PHP is C with a great many statically linked
# dependencies, and it does not cross-compile the way a Go program does. That
# ceiling is real and no amount of matrix entries moves it.
#
# The phar has no such ceiling. It is PHP, so it runs wherever PHP 8.1 or later
# runs, and that is a far longer list than five. This workflow boots those
# platforms and watches the phar serve a page on each, so the support table in
# the README is a record of something observed rather than an assumption.
#
# Nothing here gates a release. A platform that breaks should be visible
# without holding up the platforms that work.

on:
  push:
    branches: [maintain]
    paths:
      - 'bin/qbixserver.phar'
      - 'tests/phar-serves.sh'
      - '.github/workflows/platforms.yml'
  pull_request:
    paths:
      - 'bin/qbixserver.phar'
      - 'tests/phar-serves.sh'
      - '.github/workflows/platforms.yml'
  workflow_dispatch:
  schedule:
    # Weekly, so a platform that breaks under us is noticed before someone
    # reports it rather than after.
    - cron: '0 6 * * 1'

permissions:
  contents: read

# A newer push to the same branch supersedes a run still queued or running:
# every push that touches the phar starts this matrix, and the runners are
# shared, so older runs would otherwise hold the queue for commits already
# replaced. Tags and pull requests each have their own ref, so a release run
# is never cancelled by a branch push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:

  # ── The BSDs ────────────────────────────────────────────────
  # Real kernels in a VM, not emulation of a Linux userland, so a difference
  # in how sockets or signals behave shows up here and nowhere else.
  bsd:
    name: ${{ matrix.os }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: freebsd
            version: '14.2'
            # Every extension is its own package here, and three of them are
            # not optional. Without tokenizer the source transform cannot run
            # and the server dies on token_get_all(); without sqlite3 it dies
            # on Class "SQLite3" not found. Each failure arrives at startup,
            # one at a time, which is why this list grew by bisection.
            #
            # sudo is required: the VM does not run as root. The original form
            # was `sudo X || X`, and it was the sudo branch that worked, not
            # the fallback -- pkg without it reports "Insufficient privileges".
            install: |
              sudo pkg install -y php83 curl
              for e in phar tokenizer pcntl posix sockets session filter ctype mbstring sqlite3 pdo_sqlite; do
                sudo pkg install -y php83-$e || true
              done
          - os: openbsd
            version: '7.6'
            # OpenBSD refuses an ambiguous name outright -- "php" matches
            # 8.1, 8.2 and 8.3, so pkg_add installed nothing at all and the
            # failure read as the platform having no PHP. The branch is named
            # with %, which is how OpenBSD selects among them.
            #
            # phar and tokenizer are not separate packages here; asking for
            # them produces "Can't find php-phar" and nothing else happens,
            # which is why the loop tolerates a miss.
            install: |
              sudo pkg_add -I curl || true
              sudo pkg_add -I php%8.3 || sudo pkg_add -I php%8.2 || true
              for e in pcntl posix sockets session filter ctype mbstring sqlite3 pdo_sqlite; do
                sudo pkg_add -I php-$e%8.3 || sudo pkg_add -I php-$e%8.2 || true
              done
              # Installed is not enabled. Each extension package puts its ini
              # in /etc/php-8.3.sample/ and PHP loads only what is linked into
              # /etc/php-8.3/ -- so pcntl was on disk, PHP never saw it, and
              # the server refused to start with no process isolation.
              for d in /etc/php-8.3 /etc/php-8.2; do
                [ -d "$d.sample" ] || continue
                for f in "$d.sample"/*.ini; do sudo ln -sf "$f" "$d/"; done
              done
              php -m | tr '\n' ' '; echo
          - os: netbsd
            version: '10.0'
            # pkg_add on NetBSD has no repository until PKG_PATH names one,
            # so every install failed with "no pkg found" -- including curl,
            # which is certainly in pkgsrc. That reads like a naming problem
            # and is not one.
            install: |
              # A quarterly branch rather than the release directory. The
              # latter keeps moving, so its php83 asked for a libxml2 newer
              # than anything beside it and pkg_add stopped on a dependency it
              # could not satisfy. A quarterly set is frozen and therefore
              # agrees with itself. Move it forward deliberately; the release
              # directory will not do it for you, it will only break.
              export PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/$(uname -p)/10.0_2026Q2/All/"
              echo "PKG_PATH=$PKG_PATH"
              # -uu, not a plain install: the image already carries an older
              # libxml2 than php83 needs, and pkg_add refuses to replace an
              # installed package ("A different version ... is already
              # installed") unless told to upgrade it -- -uu upgrades the
              # dependencies too. Retried, because the CDN has answered "no pkg
              # found" once for a package that is there.
              for try in 1 2 3; do
                sudo -E /usr/sbin/pkg_add -uu php83 curl && break
                echo "pkg_add failed, retry $try of 3"; sleep 15
              done
              for e in phar tokenizer pcntl posix sockets session filter ctype mbstring sqlite3 pdo_sqlite; do
                sudo -E /usr/sbin/pkg_add php83-$e || true
              done
              # pkgsrc names the binary after its branch (php83) and installs
              # no plain "php", so the test found no PHP at all. Each
              # extension package enables itself through php.d.
              PHP=$(command -v php || command -v php83 || echo /usr/pkg/bin/php83)
              export PHP
              "$PHP" -m | tr '\n' ' '; echo

    steps:
      - uses: actions/checkout@v4

      - name: Serve a page on ${{ matrix.os }}
        uses: cross-platform-actions/action@v0.26.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          shell: sh
          run: |
            ${{ matrix.install }}
            sh tests/phar-serves.sh bin/qbixserver.phar

  # ── Linux architectures we ship no binary for ───────────────
  # The official PHP images carry neither pcntl nor php-cgi, so the server
  # falls back to a mode it has no binary for and answers 500 to everything.
  # pcntl is how it is meant to run, and it is bundled with PHP -- it just has
  # to be built.
  # A 32-bit Raspberry Pi, an IBM Z mainframe and a RISC-V board are all just
  # PHP as far as the phar is concerned. Emulated through qemu, so these are
  # slow, and correctness is the only thing being asked of them.
  linux-arch:
    name: linux/${{ matrix.platform }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/386        # 32-bit x86, still in the field on older kit
          - linux/arm/v5     # ARMv5, the oldest the official image carries
          - linux/arm/v7     # Raspberry Pi 2 and 3 in 32-bit mode
          - linux/arm64      # Raspberry Pi 4 and 5, also a shipped binary
          - linux/ppc64le    # POWER
          # RISC-V, the newest architecture here. PCRE's JIT segfaults under
          # qemu-riscv64 -- a pure-regex unit test dumps core with it on and
          # passes with it off -- so the container turns it off above. That is
          # an emulation fault rather than anything about RISC-V or about this
          # server, and real hardware is untested either way.
          - linux/riscv64
          - linux/s390x      # IBM Z, and big-endian, which finds real bugs

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - name: Serve a page on ${{ matrix.platform }}
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD":/src -w /src \
            php:8.3-cli \
            sh -c 'apt-get update -qq >/dev/null 2>&1; \
                   apt-get install -y -qq curl >/dev/null 2>&1; \
                   docker-php-ext-install pcntl sockets >/dev/null 2>&1; \
                   [ "$(uname -m)" = riscv64 ] \
                     && echo pcre.jit=0 > /usr/local/etc/php/conf.d/99-no-pcre-jit.ini; \
                   sh tests/phar-serves.sh bin/qbixserver.phar'

  # ── musl, rather than glibc ─────────────────────────────────
  # Alpine is not an exotic platform, it is most of the Docker images in the
  # world, and it is the one place here where the C library underneath PHP is
  # a different implementation rather than a different build. Assumptions about
  # DNS, threads and locales are what break, and they break here first.
  musl:
    name: alpine ${{ matrix.platform }} (musl)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/386

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - name: Serve a page on ${{ matrix.platform }}
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD":/src -w /src \
            php:8.3-cli-alpine \
            sh -c 'apk add --no-cache curl linux-headers >/dev/null 2>&1; \
                   docker-php-ext-install pcntl sockets >/dev/null 2>&1; \
                   sh tests/phar-serves.sh bin/qbixserver.phar'

  # ── The other Unixes ───────────────────────────────────────
  # DragonFly went its own way after FreeBSD 4 and schedules differently.
  # illumos is the surviving OpenSolaris line, and carries a genuinely
  # different set of system calls underneath the same POSIX surface.
  unix:
    name: ${{ matrix.os }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: dragonflybsd
            action: vmactions/dragonflybsd-vm@v1
            install: pkg install -y php83 curl
          - os: omnios
            action: vmactions/omnios-vm@v1
            install: pkg install php-83 curl || pkg install curl

    steps:
      - uses: actions/checkout@v4

      - name: Serve a page on ${{ matrix.os }}
        uses: vmactions/dragonflybsd-vm@v1
        if: matrix.os == 'dragonflybsd'
        with:
          usesh: true
          # No sudo here: vmactions runs prepare as root, unlike
          # cross-platform-actions above, which runs as a user and
          # needs it. The two privilege models are not the same, and
          # pkg without the privileges it needs says only
          # "Insufficient privileges" without saying whose.
          prepare: |
            pkg install -y php83 curl
            for e in phar tokenizer pcntl posix sockets session filter ctype mbstring sqlite3 pdo_sqlite; do
              pkg install -y php83-$e || true
            done
          run: sh tests/phar-serves.sh bin/qbixserver.phar

      - name: Serve a page on ${{ matrix.os }}
        uses: vmactions/omnios-vm@v1
        if: matrix.os == 'omnios'
        with:
          usesh: true
          prepare: pkg install php-83 curl || pkg install curl
          run: sh tests/phar-serves.sh bin/qbixserver.phar

  # ── Haiku ───────────────────────────────────────────────────
  # The successor to BeOS, and the one platform here with no ready-made action
  # and no published image for a CI runner. Haiku carries PHP in its own
  # package repository, so there is every reason to think the phar runs; this
  # job is what would establish it.
  #
  # It is left disabled rather than passing vacuously. Booting Haiku under qemu
  # needs an anyboot image, a serial console and a way in, and a job that is
  # quietly skipped is worse than one that is honestly absent. Enable it by
  # running this workflow by hand with `haiku` set.
  haiku:
    name: haiku x86_64 (experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Boot Haiku and serve a page
        run: |
          echo "Haiku support is not yet automated."
          echo
          echo "What is known:"
          echo "  - Haiku ships PHP in HaikuPorts, so the interpreter exists."
          echo "  - The phar needs nothing but that interpreter."
          echo "  - tests/phar-serves.sh is POSIX sh and avoids every tool"
          echo "    Haiku does not have, so it should run there unchanged."
          echo
          echo "What is missing: a booted Haiku in CI. The route is a nightly"
          echo "anyboot image under qemu with SSH enabled, which is a piece of"
          echo "work in its own right and is not pretended to be done here."
          exit 1
