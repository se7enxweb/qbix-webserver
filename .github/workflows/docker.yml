name: Docker images

# The server on the official PHP image, one image per PHP version x variant,
# for amd64 and arm64: ghcr.io/se7enxweb/qbix-webserver. docs/docker.md has
# the tags and what each variant carries; packaging/docker/ builds them.
#
# Every run builds and tests (the server answers /Q/health, and the engine's
# own `ext:check` finds the variant complete). Only a tag -- or a manual run
# asked to -- pushes.

on:
  push:
    tags: ['v*']
    branches: [maintain]
    paths:
      - 'packaging/docker/**'
      - 'packaging/bin/**'
      - 'build/extensions.json'
      - 'bin/qbixserver.phar'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'packaging/docker/**'
      - 'build/extensions.json'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
    inputs:
      php:
        description: 'PHP versions, comma-separated (empty = all in the manifest)'
        default: ''
      variants:
        description: 'Variants, comma-separated (empty = mini,lite,standard,full)'
        default: ''
      push:
        description: 'Push the images to GHCR (true/false)'
        default: 'false'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

# A newer push to the same branch supersedes a run still queued or running:
# every push that touches the phar starts this matrix, and the runners are
# shared, so older runs would otherwise hold the queue for commits already
# replaced. Tags and pull requests each have their own ref, so a release run
# is never cancelled by a branch push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      images: ${{ steps.plan.outputs.images }}
      newest: ${{ steps.plan.outputs.newest }}
      push: ${{ steps.plan.outputs.push }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Plan
        id: plan
        run: |
          php packaging/docker/matrix.php '${{ github.event.inputs.php }}' '${{ github.event.inputs.variants }}' >> "$GITHUB_OUTPUT"
          push=false
          if [ "${GITHUB_REF_TYPE}" = tag ] || [ '${{ github.event.inputs.push }}' = true ]; then push=true; fi
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: php${{ matrix.php }} ${{ matrix.variant }} ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    env:
      TAG: php${{ matrix.php }}-${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            VARIANT=${{ matrix.variant }}
          load: true
          tags: qbix-test:${{ env.TAG }}
          cache-from: type=gha,scope=${{ env.TAG }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ env.TAG }}-${{ matrix.arch }}

      - name: Serves a page, is healthy, carries its baseline
        run: |
          set -e
          docker run --rm qbix-test:$TAG cat /usr/share/qbix-webserver/image-extensions.txt
          docker run --rm qbix-test:$TAG qbixctl ext:check --variant='${{ matrix.variant }}'
          cid=$(docker run -d -p 18080:8080 qbix-test:$TAG)
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/Q/health || true)
            [ "$code" = 200 ] && break; sleep 1
          done
          docker logs "$cid" | tail -20
          [ "$code" = 200 ] || { echo "::error::/Q/health answered $code"; exit 1; }
          docker exec "$cid" php /usr/share/qbix-webserver/packaging/docker/healthcheck.php
          docker rm -f "$cid" >/dev/null
          docker image ls qbix-test:$TAG

      - name: Log in to GHCR
        if: needs.plan.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push this architecture
        if: needs.plan.outputs.push == 'true'
        run: |
          ref="$IMAGE:${{ needs.plan.outputs.version }}-$TAG-${{ matrix.arch }}"
          docker tag qbix-test:$TAG "$ref"
          docker push "$ref"

  # One multi-architecture tag per image from the per-architecture pushes:
  # <version>-php<ver>-<variant>, php<ver>-<variant>, and latest for the
  # newest PHP's standard image.
  publish:
    needs: [plan, build]
    if: needs.plan.outputs.push == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag
        run: |
          v='${{ needs.plan.outputs.version }}'
          t='php${{ matrix.php }}-${{ matrix.variant }}'
          tags="-t $IMAGE:$v-$t -t $IMAGE:$t"
          if [ '${{ matrix.php }}' = '${{ needs.plan.outputs.newest }}' ] && [ '${{ matrix.variant }}' = standard ]; then
            tags="$tags -t $IMAGE:latest -t $IMAGE:$v"
          fi
          docker buildx imagetools create $tags "$IMAGE:$v-$t-amd64" "$IMAGE:$v-$t-arm64"
          docker buildx imagetools inspect "$IMAGE:$v-$t"
